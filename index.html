<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>NBA Core Plays</title>
<style>
  :root {
    --bg: #ffffff; --panel: #f6f7f9; --line: #e3e6eb; --ink: #14181f; --muted: #667085;
    --navy: #1a2744; --accent: #fe6a03;
    --core: #15803d; --strong: #1d4ed8; --large: #7c3aed;
    --good: #15803d; --warn: #b45309; --bad: #b91c1c;
    --radius: 10px;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #12151c; --panel: #1b202a; --line: #2a303c; --ink: #e8eaf0; --muted: #97a0b3;
      --core: #22c55e; --strong: #3b82f6; --large: #a78bfa;
      --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
    }
  }
  :root[data-theme="dark"] {
    --bg: #12151c; --panel: #1b202a; --line: #2a303c; --ink: #e8eaf0; --muted: #97a0b3;
    --core: #22c55e; --strong: #3b82f6; --large: #a78bfa;
    --good: #4ade80; --warn: #fbbf24; --bad: #f87171;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
  .wrap { max-width: 980px; margin: 0 auto; padding: 14px 16px 18px; }

  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 12px; }
  h1 { margin: 0; font-size: 22px; letter-spacing: -0.2px; }
  .sub { color: var(--muted); font-size: 12.5px; margin-top: 2px; }

  .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 10px; }
  .tabs { display: flex; gap: 4px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; overflow-x: auto; max-width: 100%; }
  .tab, .seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-weight: 600; padding: 6px 14px; border-radius: 999px; cursor: pointer; white-space: nowrap; }
  .tab.on, .seg button.on { background: var(--navy); color: #fff; }
  :root[data-theme="dark"] .tab.on, :root[data-theme="dark"] .seg button.on { background: #3b5bdb; }
  .seg { display: flex; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 3px; }
  .grow { flex: 1; }
  #sort { display: none; }
  select, input[type=search] { font: inherit; color: var(--ink); background: var(--panel); border: 1px solid var(--line); border-radius: 999px; padding: 6px 12px; }
  label.chk { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: 12.5px; cursor: pointer; }

  .group-h { display: flex; align-items: baseline; gap: 8px; margin: 18px 0 6px; padding-bottom: 5px; border-bottom: 2px solid var(--accent); }
  .group-h h2 { margin: 0; font-size: 15px; color: var(--navy); letter-spacing: .4px; }
  :root[data-theme="dark"] .group-h h2 { color: #e8eaf0; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .group-h h2 { color: #e8eaf0; } }
  .group-h span { color: var(--muted); font-size: 12px; }

  .cols { display: grid; grid-template-columns: 28px minmax(150px, 0.6fr) 66px 62px 66px 54px 54px 3.4fr; gap: 10px; padding: 6px 10px 6px 14px; color: var(--muted); font-size: 11px; text-transform: uppercase; letter-spacing: .5px; }
  .row { display: grid; grid-template-columns: 28px minmax(150px, 0.6fr) 66px 62px 66px 54px 54px 3.4fr; gap: 10px; align-items: start; padding: 10px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--bg); margin-bottom: 6px; }
  .row:hover { background: var(--panel); }
  .row[data-t=Core] { border-left: 4px solid var(--core); }
  .row[data-t=GPP] { border-left: 4px solid var(--large); }
  .rank { color: var(--muted); font-weight: 700; padding-top: 2px; }
  .who { display: flex; gap: 9px; align-items: center; min-width: 0; }
  .logo { flex: 0 0 34px; width: 34px; height: 34px; object-fit: contain; }
  .logo[hidden] { display: none; }
  .nm { font-weight: 700; line-height: 1.2; }
  .mt { color: var(--muted); font-size: 12px; }
  .pill { display: inline-block; font-size: 10.5px; font-weight: 700; padding: 1px 7px; border-radius: 999px; color: #fff; letter-spacing: .3px; vertical-align: 1px; }
  .t-Core { background: var(--core); } .t-GPP { background: var(--large); }
  :root[data-theme="dark"] .pill[class*="t-"] { color: #0b1220; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pill[class*="t-"] { color: #0b1220; } }
  .oppcell { display: flex; align-items: center; gap: 6px; font-weight: 600; padding-top: 1px; white-space: nowrap; }
  .mopp { display: none; }
  .typecell { padding-top: 1px; }
  .mtype { display: none; }
  .cols .s { cursor: pointer; user-select: none; }
  .cols .s:hover, .cols .s.on { color: var(--ink); }
  .cols .s .ar { position: absolute; margin-left: 3px; font-size: 9px; }
  .st { margin-left: 4px; background: transparent; border: 1px solid currentColor; }
  .st.good { color: var(--good); } .st.warn { color: var(--warn); } .st.bad { color: var(--bad); } .st.neutral { color: var(--muted); }
  .num { font-variant-numeric: tabular-nums; text-align: right; padding-top: 2px; }
  .num.ctr { text-align: center; }
  .num small { display: none; color: var(--muted); font-size: 10.5px; }
  .val-hi { color: var(--good); font-weight: 700; }
  .blurb { color: var(--ink); opacity: .92; }
  .blurb strong { font-weight: 700; }
  .empty { padding: 28px; text-align: center; color: var(--muted); }
  footer { margin-top: 14px; color: var(--muted); font-size: 11.5px; }

  .upd { display: flex; align-items: center; gap: 8px; font-size: 15px; font-weight: 800; color: var(--accent); background: rgba(254,106,3,.10); border: 1px solid rgba(254,106,3,.35); border-radius: 999px; padding: 6px 14px; white-space: nowrap; }
  .upd .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--accent); box-shadow: 0 0 0 0 rgba(254,106,3,.6); animation: pulse 2s infinite; }
  @keyframes pulse { 70% { box-shadow: 0 0 0 7px rgba(254,106,3,0); } 100% { box-shadow: 0 0 0 0 rgba(254,106,3,0); } }
  @media (prefers-reduced-motion: reduce) { .upd .dot { animation: none; } }
  .hright { display: flex; align-items: center; gap: 10px; }
  .themebtn { width: 38px; height: 38px; border-radius: 50%; border: 1px solid var(--line); background: var(--panel); color: var(--ink); cursor: pointer; font-size: 17px; line-height: 1; display: grid; place-items: center; }
  .themebtn:hover { border-color: var(--accent); }
  .hqlink { margin-left: auto; align-self: center; font-weight: 700; font-size: 13px; color: #fff; background: #06184a; border: 1px solid #06184a; text-decoration: none; padding: 6px 14px; border-radius: 999px; white-space: nowrap; }
  .hqlink:hover { filter: brightness(1.25); }
  :root[data-theme="dark"] .hqlink { border-color: rgba(255,255,255,.28); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .hqlink { border-color: rgba(255,255,255,.28); } }
  .nm a { color: inherit; text-decoration: none; }
  .nm a:hover { color: var(--accent); text-decoration: underline; }
  .pill.out { background: var(--bad); border-color: var(--bad); color: #fff; margin-left: 4px; }
  .row.is-out { opacity: .62; }
  .row.is-out .nm a, .row.is-out .nm > span { text-decoration: line-through; }
  .outwarn { background: rgba(185,28,28,.10); border: 1px solid rgba(185,28,28,.4); color: var(--bad); border-radius: 8px; padding: 8px 12px; margin: 0 0 10px; font-weight: 600; font-size: 13px; }
  .views { display: flex; align-items: center; gap: 20px; border-bottom: 1px solid var(--line); margin-bottom: 12px; }
  .views button { background: none; border: 0; font: inherit; font-weight: 700; color: var(--muted); padding: 8px 2px; cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -1px; }
  .views button.on { color: var(--ink); border-bottom-color: var(--accent); }
  .views .cnt { background: var(--bad); color: #fff; border-radius: 999px; font-size: 11px; padding: 1px 7px; margin-left: 5px; }
  .cols.inj { padding-left: 11px; }
  .cols.inj, .row.inj { grid-template-columns: minmax(170px, 1fr) 100px 1.3fr 1.7fr; }
  .row.inj .nm { font-size: 14px; }
  .inj-boost { font-weight: 600; }
  .pill.new { background: var(--accent); margin-left: 4px; }
  body.inj-view .play-only, body.inj-view #sort { display: none !important; }
  body:not(.inj-view) .inj-only { display: none !important; }

  @media (max-width: 700px) {
    .row.inj { grid-template-columns: 1fr auto; }
    .row.inj .inj-note, .row.inj .inj-boost { grid-column: 1 / -1; }
    .inj-boost::before { content: "If out → "; color: var(--good); font-weight: 700; }
    .cols { display: none; }
    .row { grid-template-columns: 24px 1fr auto auto auto; row-gap: 6px; }
    .typecell, .oppcell { display: none; }
    .mopp { display: inline; }
    .mtype { display: inline-block; }
    #sort { display: block; }
    .who { grid-column: 2 / 3; }
    .blurb { grid-column: 1 / -1; }
    .num { text-align: right; }
    .num.ctr { text-align: center; }
    .num small { display: block; }
    }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1 id="title">Core Plays</h1>
      <div class="sub" id="sub"></div>
    </div>
    <div class="hright">
      <button class="themebtn" id="themeBtn" type="button" aria-label="Toggle dark mode" title="Toggle dark mode"></button>
      <div class="upd" id="upd" style="display:none"><span class="dot"></span><span id="updText"></span></div>
    </div>
  </header>

  <div class="views" id="views">
    <button data-v="plays" class="on">Core Plays</button>
    <button data-v="inj">Injuries<span class="cnt" id="injCnt" style="display:none"></span></button>
    <a class="hqlink" id="hqLink" href="https://rotogrinders.com/lineuphq/nba?site=draftkings" target="_blank" rel="noopener">Build lineups in LineupHQ ↗</a>
  </div>

  <div class="controls">
    <div class="seg play-only" id="siteSeg">
      <button data-site="dk" class="on">DraftKings</button><button data-site="fd">FanDuel</button>
    </div>
    <div class="tabs play-only" id="tagTabs"></div>
    <div class="tabs play-only" id="tabs"></div>
    <select id="sort" class="play-only" aria-label="Sort">
      <option value="rank">Our order</option>
      <option value="proj">Projection</option>
      <option value="value">Value</option>
    </select>
    <div class="tabs inj-only" id="statusTabs"></div>
    <span class="grow"></span>
  </div>

  <div id="outWarn"></div>
  <div id="list"></div>
  <footer id="foot"></footer>
</div>

<script>
const params = new URLSearchParams(location.search);
// Theme: ?theme= wins, then the reader's saved choice, otherwise follow their device.
let savedTheme = null;
try { savedTheme = localStorage.getItem("cp-theme"); } catch (e) {}
const startTheme = params.get("theme") || savedTheme;
if (startTheme === "dark" || startTheme === "light") document.documentElement.dataset.theme = startTheme;
const isDark = () => document.documentElement.dataset.theme
  ? document.documentElement.dataset.theme === "dark"
  : matchMedia("(prefers-color-scheme: dark)").matches;
function paintThemeBtn() { $("themeBtn").textContent = isDark() ? "☀" : "☾"; $("themeBtn").title = isDark() ? "Switch to light mode" : "Switch to dark mode"; }

const POS_NAMES = { PG: "Point Guard", SG: "Shooting Guard", SF: "Small Forward", PF: "Power Forward", C: "Center" };
const state = { pos: "ALL", site: params.get("site") === "fd" ? "fd" : "dk", sort: "rank", dir: "desc", q: "", type: "", view: "plays", status: "" };
let DATA = null;

const $ = id => document.getElementById(id);
// Team logos are loaded by abbreviation from the image host below, so the Team/Opp values in the sheet must match its
// file names (e.g. .../nba/PHI.png). Missing logos simply don't show.
const LOGO_PATH = abbr => `https://rical-images.s3.amazonaws.com/team-logos/nba/${abbr}.png`;
const logoImg = t => t ? `<img class="logo" src="${esc(LOGO_PATH(String(t).toUpperCase()))}" alt="" loading="lazy" onerror="this.hidden=true">` : "";
const fmtMoney = n => n ? "$" + Number(n).toLocaleString() : "–";
const initials = n => n.split(/\s+/).map(w => w[0]).slice(0, 2).join("").toUpperCase();

function esc(s) { return String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
// Blurb markup: **bold** only. Everything else is escaped.
function blurbHtml(s) { return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>"); }

// Sheet may say "Large-Field" or "GPP"; both display as GPP.
function tagOf(p) { const t = String(p.type || p.tier || "").trim(); return /^(large|gpp)/i.test(t) ? "GPP" : /^core/i.test(t) ? "Core" : ""; }

// ---- name matching (same idea as the NFL players.json: lowercase, letters/numbers only)
const nameKey = n => String(n || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "").replace(/[^a-z0-9]/g, "");
const nameKeys = n => { const k = nameKey(n); return [k, k.replace(/(jr|sr|ii|iii|iv)$/, "")]; };

// ---- RG player pages. players.json maps a name key to either "slug-id" or a full URL.
// If your NBA pages live somewhere other than /players/, change PLAYER_BASE.
const PLAYER_BASE = "https://rotogrinders.com/players/";
let PLAYERS = {};
function playerUrl(p) {
  if (p.url) return p.url;
  for (const k of nameKeys(p.player)) {
    const v = PLAYERS[k];
    if (v) return /^https?:/.test(v) ? v : PLAYER_BASE + v;
  }
  return "";
}
function nameHtml(p) {
  const u = playerUrl(p);
  return u ? `<a href="${esc(u)}" target="_blank" rel="noopener">${esc(p.player)}</a>` : `<span>${esc(p.player)}</span>`;
}

// ---- auto OUT: any play whose player is OUT on the Injuries tab
let OUT = new Map();
function buildOut() {
  OUT = new Map();
  (DATA.injuries || []).forEach(i => {
    if (/^\s*out/i.test(String(i.status || ""))) nameKeys(i.player).forEach(k => OUT.set(k, i));
  });
}
function outEntry(p) { for (const k of nameKeys(p.player)) if (OUT.has(k)) return OUT.get(k); return null; }

function statusClass(s) {
  const u = String(s).toUpperCase();
  if (/^(OUT|DOUBT|IR)/.test(u)) return "bad";
  if (/^(Q|GTD|DTD|PROB)/.test(u)) return "warn";
  if (/^(BOOST|UP|▲|START)/.test(u)) return "good";
  return "neutral";
}

function salary(p) { return Number(state.site === "dk" ? p.dk : p.fd) || 0; }
function valueOf(p) { const s = salary(p); return s ? Number(p.proj) / (s / 1000) : 0; }

function rowEl(p, rank, valCut) {
  const el = document.createElement("div");
  const type = tagOf(p);
  el.className = "row";
  el.dataset.t = type;
  const oe = outEntry(p);
  if (oe) el.classList.add("is-out");
  const outPill = oe && !/^\s*out/i.test(String(p.status || "")) ? `<span class="pill out" title="${esc(oe.note || "Listed OUT")}">OUT</span>` : "";
  const st = p.status ? `<span class="pill st ${statusClass(p.status)}">${esc(p.status)}</span>` : "";
  const tier = type ? `<span class="pill t-${esc(type)}">${esc(type)}</span>` : "";
  const v = valueOf(p);
  el.innerHTML = `
    <div class="rank">${rank}</div>
    <div class="who">
      ${logoImg(p.team)}
      <div>
        <div class="nm">${nameHtml(p)}</div>
        <div class="mt">${esc(p.pos)} · ${esc(p.team)}<span class="mopp"> ${esc(p.opp)}</span> <span class="mtype">${tier}</span>${outPill}${st}</div>
      </div>
    </div>
    <div class="oppcell"><span>${esc(p.opp)}</span></div>
    <div class="typecell">${tier}</div>
    <div class="num"><small>Salary</small>${fmtMoney(salary(p))}</div>
    <div class="num ctr"><small>Proj</small>${p.proj ? Number(p.proj).toFixed(1) : "–"}</div>
    <div class="num ctr ${v >= valCut ? "val-hi" : ""}"><small>Value</small>${v ? v.toFixed(2) + "x" : "–"}</div>
    <div class="blurb">${blurbHtml(p.blurb)}</div>`;
  return el;
}

function sorted(list) {
  const idx = new Map(DATA.plays.map((p, i) => [p, i]));
  const m = state.dir === "asc" ? 1 : -1;
  const by = {
    rank: (a, b) => idx.get(a) - idx.get(b),
    proj: (a, b) => m * (a.proj - b.proj),
    value: (a, b) => m * (valueOf(a) - valueOf(b))
  }[state.sort];
  return [...list].sort(by);
}

let STATUSES = [];
function buildChips(id, values, get, set, allLabel) {
  const el = $(id);
  el.innerHTML = "";
  values.forEach(v => {
    const b = document.createElement("button");
    b.className = "tab" + (get() === v ? " on" : "");
    b.textContent = v === "" ? allLabel : v;
    b.onclick = () => { set(v); buildChips(id, values, get, set, allLabel); render(); };
    el.appendChild(b);
  });
}

function setSort(k) {
  if (k === "rank") { state.sort = "rank"; state.dir = "desc"; }
  else if (state.sort === k) state.dir = state.dir === "desc" ? "asc" : "desc";
  else { state.sort = k; state.dir = "desc"; }
  $("sort").value = state.sort;
  render();
}

function fmtUpdated(u) {
  if (!u) return { text: "", fresh: false };
  const d = new Date(u);
  if (isNaN(d) || !/\d{4}-\d\d-\d\d/.test(u)) return { text: String(u), fresh: false };
  return { text: d.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }), fresh: Date.now() - d.getTime() < 2 * 3600e3 && Date.now() >= d.getTime() };
}

function renderInj() {
  $("outWarn").innerHTML = "";
  const q = state.q.trim().toLowerCase();
  const list = $("list");
  list.innerHTML = "";
  const items = (DATA.injuries || []).filter(i =>
    (!state.status || String(i.status || "").toUpperCase().startsWith(state.status)) &&
    (!q || (i.player + " " + i.team + " " + i.note + " " + i.boost).toLowerCase().includes(q)));
  if (!items.length) { list.innerHTML = '<div class="empty">No injuries listed.</div>'; postHeight(); return; }
  const h = document.createElement("div");
  h.className = "cols inj";
  h.innerHTML = "<div>Player</div><div>Status</div><div>Injury / note</div><div>If out, boost…</div>";
  list.appendChild(h);
  items.forEach(i => {
    const u = fmtUpdated(i.updated);
    const el = document.createElement("div");
    el.className = "row inj";
    el.innerHTML = `
      <div class="who">${logoImg(i.team)}<div><div class="nm">${nameHtml(i)}</div><div class="mt">${esc(i.team)}</div></div></div>
      <div><span class="pill st ${statusClass(i.status)}" style="margin-left:0">${esc(i.status)}</span>${u.fresh ? '<span class="pill new">NEW</span>' : ""}</div>
      <div class="inj-note">${esc(i.note)}</div>
      <div class="inj-boost">${blurbHtml(i.boost)}</div>`;
    list.appendChild(el);
  });
  postHeight();
}

function setView(v) {
  state.view = v;
  document.body.classList.toggle("inj-view", v === "inj");
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === v));
  render();
}

function render() {
  if (state.view === "inj") return renderInj();
  const q = state.q.trim().toLowerCase();
  let plays = DATA.plays.filter(p =>
    (state.pos === "ALL" || p.pos === state.pos) &&
    (!state.type || tagOf(p) === state.type) &&
    (!q || (p.player + " " + p.team + " " + p.opp + " " + p.blurb).toLowerCase().includes(q)));
  const vals = DATA.plays.map(valueOf).filter(Boolean).sort((a, b) => b - a);
  const valCut = vals[Math.floor(vals.length * 0.2)] || Infinity; // top 20% highlighted

  const list = $("list");
  list.innerHTML = "";
  const outNow = DATA.plays.filter(outEntry);
  $("outWarn").innerHTML = outNow.length
    ? `<div class="outwarn">⚠ Listed OUT: ${outNow.map(p => esc(p.player)).join(", ")}. Check the Injuries tab before locking these in.</div>` : "";
  if (!plays.length) { list.innerHTML = '<div class="empty">No plays match.</div>'; return; }

  const header = () => {
    const h = document.createElement("div");
    h.className = "cols";
    const ar = k => `<span class="ar">${state.sort === k ? (state.dir === "asc" ? "▲" : "▼") : ""}</span>`;
    const on = k => state.sort === k ? " on" : "";
    h.innerHTML = `<div class="s${on("rank")}" data-k="rank" title="Back to our order">#</div><div>Player</div><div>Opp</div><div>Tag</div><div style="text-align:right">Salary</div>` +
      `<div class="s${on("proj")}" data-k="proj" style="text-align:center" title="Sort by projection">Proj${ar("proj")}</div>` +
      `<div class="s${on("value")}" data-k="value" style="text-align:center" title="Sort by value">Value${ar("value")}</div><div>Player Notes</div>`;
    h.querySelectorAll(".s").forEach(el => el.onclick = () => setSort(el.dataset.k));
    return h;
  };

  const groups = state.pos === "ALL" ? DATA.positions : [state.pos];
  for (const g of groups) {
    const items = sorted(plays.filter(p => p.pos === g));
    if (!items.length) continue;
    if (state.pos === "ALL") {
      const h = document.createElement("div");
      h.className = "group-h";
      h.innerHTML = `<h2>${esc(POS_NAMES[g] || g)}</h2><span>${items.length} play${items.length > 1 ? "s" : ""}</span>`;
      list.appendChild(h);
    }
    list.appendChild(header());
    items.forEach((p, i) => list.appendChild(rowEl(p, i + 1, valCut)));
  }
  postHeight();
}

function buildTabs() {
  const tabs = $("tabs");
  tabs.innerHTML = "";
  ["ALL", ...DATA.positions].forEach(p => {
    const b = document.createElement("button");
    b.className = "tab" + (state.pos === p ? " on" : "");
    b.textContent = p === "ALL" ? "All" : p;
    b.onclick = () => { state.pos = p; buildTabs(); render(); };
    tabs.appendChild(b);
  });
}

function postHeight() {
  const h = document.documentElement.scrollHeight;
  try { parent.postMessage({ type: "core-plays-height", height: h }, "*"); } catch (e) {}
}

fetch("players.json?v=" + Date.now()).then(r => r.ok ? r.json() : {}).catch(() => ({})).then(pj => { PLAYERS = pj || {}; return fetch("data.json?v=" + Date.now()); }).then(r => { if (!r.ok) throw new Error("data.json not found (HTTP " + r.status + ")"); return r.json(); }).then(d => {
  DATA = d;
  d.plays = d.plays || []; d.injuries = d.injuries || [];
  buildOut();
  if (!DATA.positions || !DATA.positions.length) DATA.positions = [...new Set(DATA.plays.map(p => p.pos))];
  $("title").textContent = d.title || "Core Plays";
  const upd = d.updated ? new Date(d.updated) : null;
  $("sub").textContent = [d.date, d.slate].filter(Boolean).join(" · ");
  if (upd && !isNaN(upd)) {
    const sameDay = upd.toDateString() === new Date().toDateString();
    const t = upd.toLocaleTimeString([], { hour: "numeric", minute: "2-digit", timeZoneName: "short" });
    $("updText").textContent = "Updated " + (sameDay ? "" : upd.toLocaleDateString([], { weekday: "short" }) + " ") + t;
    $("upd").style.display = "";
  }
  document.querySelectorAll("#siteSeg button").forEach(b => b.classList.toggle("on", b.dataset.site === state.site));
  $("hqLink").href = "https://rotogrinders.com/lineuphq/nba?site=" + (state.site === "fd" ? "fanduel" : "draftkings");
  $("foot").textContent = "Value = projected points per $1K of salary (top 20% highlighted).";
  const inj = d.injuries || [];
  if (inj.length) { $("injCnt").textContent = inj.length; $("injCnt").style.display = ""; }
  STATUSES = ["", ...new Set(inj.map(i => String(i.status || "").split(/\s|-/)[0].toUpperCase()))];
  buildChips("statusTabs", STATUSES, () => state.status, v => { state.status = v; }, "All");
  buildChips("tagTabs", ["", "Core", "GPP"], () => state.type, v => { state.type = v; }, "All");
  if (params.get("view") === "injuries") state.view = "inj";
  document.body.classList.toggle("inj-view", state.view === "inj");
  document.querySelectorAll("#views button").forEach(b => b.classList.toggle("on", b.dataset.v === state.view));
  buildTabs(); render();
}).catch(e => { console.error(e); $("list").innerHTML = '<div class="empty">Could not load data.json.<br><small>' + esc(e && e.message || e) + '</small></div>'; });

document.querySelectorAll("#siteSeg button").forEach(b => b.onclick = () => {
  state.site = b.dataset.site;
  $("hqLink").href = "https://rotogrinders.com/lineuphq/nba?site=" + (state.site === "fd" ? "fanduel" : "draftkings");
  document.querySelectorAll("#siteSeg button").forEach(x => x.classList.toggle("on", x === b));
  render();
});
$("sort").onchange = e => { state.sort = e.target.value; state.dir = "desc"; render(); };
document.querySelectorAll("#views button").forEach(b => b.onclick = () => setView(b.dataset.v));
$("themeBtn").onclick = () => {
  const next = isDark() ? "light" : "dark";
  document.documentElement.dataset.theme = next;
  try { localStorage.setItem("cp-theme", next); } catch (e) {}
  paintThemeBtn();
};
matchMedia("(prefers-color-scheme: dark)").addEventListener?.("change", paintThemeBtn);
paintThemeBtn();
new ResizeObserver(postHeight).observe(document.body);
</script>
</body>
</html>
